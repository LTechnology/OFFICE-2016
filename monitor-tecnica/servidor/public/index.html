<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor de Técnica</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Técnica">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151923" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Estilo de dashboard claro (referencia que eligió el equipo): fondo gris azulado, tarjetas blancas
     con sombra suave, números grandes, íconos en círculos de color suave y un solo azul de marca.
     Estados: verde = prendido/abierto, rojo = apagado/cerrado, gris = sin datos. */
  :root {
    --fondo: #eef1f6; --tarjeta: #ffffff; --texto: #262b38; --tenue: #8a91a3; --linea: #eceff4;
    --azul: #3b7cf6; --azul-suave: #e8f0fe;
    --verde: #1fb36b; --verde-suave: #e3f7ec; --rojo: #f0465a; --rojo-suave: #fde8eb;
    --gris: #c4c9d4; --gris-suave: #f1f3f7; --ambar: #f29b11; --ambar-suave: #fef3e0;
    --sombra: 0 6px 24px rgba(31, 45, 80, .07), 0 1px 3px rgba(31, 45, 80, .05);
    --haz: #ffe7a3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #151923; --tarjeta: #1e2330; --texto: #eef0f5; --tenue: #8f97aa; --linea: #2a3040;
      --azul: #6b9dff; --azul-suave: #22304d; --verde: #33cc80; --verde-suave: #183a2a; --rojo: #ff5f71; --rojo-suave: #45202a;
      --gris: #4c5466; --gris-suave: #262c3a; --ambar: #ffb547; --ambar-suave: #45341a; --sombra: 0 6px 24px rgba(0,0,0,.25); --haz: #fff0bf; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

  /* Estructura: barra lateral (compu) / barra inferior (celular) + contenido */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .lateral { background: var(--tarjeta); box-shadow: var(--sombra); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; align-self: start; }
  .marca { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; font-weight: 800; font-size: 16px; }
  .marca img { width: 34px; height: 34px; border-radius: 9px; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; border: 0; background: none; color: var(--tenue);
    font-weight: 600; cursor: pointer; text-align: left; text-decoration: none; width: 100%; }
  .nav svg { width: 20px; height: 20px; flex: none; }
  .nav.activa { background: var(--azul-suave); color: var(--azul); }
  .nav .cuenta { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--rojo); color: #fff; font-size: 12px; display: grid; place-items: center; }
  .lateral .abajo { margin-top: auto; display: grid; gap: 4px; }

  .contenido { padding: 24px 28px 32px; max-width: 1280px; width: 100%; }
  .cabecera { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .cabecera .txt { flex: 1; min-width: 0; }
  .cabecera h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .cabecera .sub { margin: 2px 0 0; color: var(--tenue); font-weight: 500; }
  .cabecera .sub.rojo { color: var(--rojo); font-weight: 600; }
  .vivo { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--tarjeta); box-shadow: var(--sombra);
    font-size: 13px; font-weight: 600; color: var(--tenue); white-space: nowrap; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--gris); }
  .punto.on { background: var(--verde); box-shadow: 0 0 0 4px var(--verde-suave); } .punto.off { background: var(--rojo); }
  .btn { padding: 9px 16px; border-radius: 10px; border: 0; background: var(--gris-suave); color: var(--texto); font-weight: 600; cursor: pointer; }
  .btn.primario { background: var(--azul); color: #fff; }

  .tarjeta { background: var(--tarjeta); border-radius: 14px; box-shadow: var(--sombra); padding: 18px 20px; }
  .tarjeta h2 { margin: 0 0 14px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .tarjeta h2 .mas { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--azul); background: none; border: 0; cursor: pointer; padding: 0; }

  /* Indicadores */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .kpi { display: flex; align-items: center; gap: 14px; }
  .circ { --c: var(--azul); --s: var(--azul-suave); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--s); color: var(--c); flex: none; }
  .circ svg { width: 22px; height: 22px; }
  .circ.verde { --c: var(--verde); --s: var(--verde-suave); } .circ.rojo { --c: var(--rojo); --s: var(--rojo-suave); }
  .circ.gris { --c: var(--tenue); --s: var(--gris-suave); } .circ.ambar { --c: var(--ambar); --s: var(--ambar-suave); }
  .kpi .num { font-size: 30px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .num small { font-size: 18px; color: var(--tenue); font-weight: 700; }
  .kpi .lbl { color: var(--tenue); font-size: 13px; font-weight: 500; }
  .kpi .det { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .det.rojo { color: var(--rojo); } .det.verde { color: var(--verde); } .det.ambar { color: var(--ambar); } .det.tenue { color: var(--tenue); }

  /* Fila central: plano + actividad reciente */
  .medio { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; margin-top: 18px; }
  #plano { display: flex; flex-direction: column; height: calc(100% - 34px); }
  #plano .escenario { flex: 1; align-content: end; }
  .escenario { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; background: var(--gris-suave); border-radius: 12px; padding: 10px 14px 12px; position: relative; }
  .escenario .rot, .cabina .rot { position: absolute; top: 8px; left: 12px; font-size: 12px; font-weight: 600; color: var(--tenue); }
  .proy { --c: var(--gris); display: grid; justify-items: center; text-align: center; }
  .proy.on { --c: var(--verde); } .proy.off { --c: var(--rojo); }
  .pantalla { width: 80%; height: 7px; border-radius: 4px; background: var(--linea); margin-top: 18px; }
  .proy.on .pantalla { background: var(--haz); box-shadow: 0 0 16px var(--haz); }
  .haz { width: 80%; height: clamp(46px, 7vw, 84px); }
  .proy.on .haz { background: linear-gradient(to top, color-mix(in srgb, var(--haz) 85%, transparent), color-mix(in srgb, var(--haz) 10%, transparent));
    clip-path: polygon(0 0, 100% 0, 54% 100%, 46% 100%); }
  .proy .cuerpo { width: 52px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--c); color: #fff; }
  .proy.nd .cuerpo { background: var(--tarjeta); color: var(--tenue); box-shadow: inset 0 0 0 1.5px var(--gris); }
  .proy .cuerpo svg { width: 28px; height: 28px; }
  .proy .n { margin-top: 6px; font-weight: 700; font-size: 14px; }
  .proy .st { font-size: 12px; font-weight: 600; color: var(--c); }
  .proy.nd .st { color: var(--tenue); }
  .cabina { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 28px 12px 12px; margin-top: 12px;
    border-radius: 12px; border: 1.5px dashed var(--linea); }
  .puesto { --c: var(--gris); display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 999px; background: var(--gris-suave); font-weight: 700; font-size: 14px; }
  .puesto .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; }
  .puesto .ic svg { width: 16px; height: 16px; }
  .puesto.on { --c: var(--verde); background: var(--verde-suave); } .puesto.off { --c: var(--rojo); background: var(--rojo-suave); }
  .puesto.nd .ic { background: var(--tarjeta); color: var(--tenue); box-shadow: inset 0 0 0 1.5px var(--gris); }
  .puesto.fuera { box-shadow: 0 0 0 2px var(--rojo); }
  .puesto.chico { font-size: 12px; padding: 5px 10px 5px 5px; } .puesto.chico .ic { width: 22px; height: 22px; } .puesto.chico .ic svg { width: 13px; height: 13px; }

  .eventos { display: grid; }
  .ev { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--linea); }
  .ev:first-child { border-top: 0; padding-top: 0; }
  .ev .circ { width: 32px; height: 32px; } .ev .circ svg { width: 16px; height: 16px; }
  .ev .txt { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; }
  .ev .hora { display: block; color: var(--tenue); font-size: 12px; margin-top: 1px; }

  /* Tarjetas de compu */
  .pcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin-top: 18px; }
  .pc.fuera { box-shadow: var(--sombra), 0 0 0 2px var(--rojo); }
  .pc-cab { display: flex; align-items: center; gap: 12px; }
  .pc-cab .txt { flex: 1; min-width: 0; }
  .pc-cab h3 { margin: 0; font-size: 17px; font-weight: 800; }
  .pc-cab .sub { color: var(--tenue); font-size: 13px; font-weight: 500; }
  .badge { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.verde { background: var(--verde-suave); color: var(--verde); } .badge.rojo { background: var(--rojo-suave); color: var(--rojo); }
  .badge.gris { background: var(--gris-suave); color: var(--tenue); } .badge.ambar { background: var(--ambar-suave); color: var(--ambar); }
  .avisos { display: grid; gap: 6px; margin-top: 12px; }
  .aviso { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .aviso.rojo { background: var(--rojo-suave); color: var(--rojo); } .aviso.ambar { background: var(--ambar-suave); color: var(--ambar); }
  .filas { list-style: none; margin: 14px 0 0; padding: 0; }
  .filas li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linea); font-weight: 600; font-size: 14px; }
  .filas .led { width: 10px; height: 10px; border-radius: 50%; background: var(--gris); flex: none; }
  .filas li.on .led { background: var(--verde); box-shadow: 0 0 0 3px var(--verde-suave); }
  .filas li.off .led { background: var(--rojo); box-shadow: 0 0 0 3px var(--rojo-suave); }
  .filas .n { flex: 1; }
  .filas .st { font-size: 13px; color: var(--tenue); font-weight: 600; }
  .filas li.on .st { color: var(--verde); } .filas li.off .st { color: var(--rojo); }
  .filas li.nd { color: var(--tenue); }
  .filas .ic { width: 22px; height: 22px; flex: none; color: var(--tenue); }
  .filas li.on .ic { color: var(--verde); } .filas li.off .ic { color: var(--rojo); }
  details.procs { margin-top: 10px; font-size: 13px; }
  details.procs summary { cursor: pointer; color: var(--azul); font-weight: 600; }
  details.procs .lista { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--gris-suave); max-height: 180px; overflow: auto; color: var(--tenue); font-size: 12px; columns: 2; }

  /* Vistas Actividad y Horarios */
  .vista[hidden] { display: none; }
  .horario { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--linea); font-weight: 600; }
  .horario:first-child { border-top: 0; padding-top: 0; }
  .horario span:last-child { color: var(--tenue); font-weight: 500; text-align: right; }
  #notif { display: grid; gap: 10px; margin-bottom: 18px; }
  #notif p { margin: 0; }
  #notif ol { margin: 0; padding-left: 20px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .meta { color: var(--tenue); font-size: 13px; }
  .vacio { color: var(--tenue); margin: 0; }
  .inferior { display: none; }

  @media (prefers-reduced-motion: no-preference) {
    .puesto.fuera, .pc.fuera { animation: alerta 1.8s ease-in-out infinite; }
    @keyframes alerta { 50% { box-shadow: var(--sombra), 0 0 0 2px transparent; } }
  }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .medio { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .lateral { display: none; }
    .contenido { padding: 16px 14px 96px; padding-top: max(16px, env(safe-area-inset-top)); }
    .kpis { gap: 10px; } .tarjeta { padding: 14px 16px; }
    .kpi { flex-direction: column; align-items: flex-start; gap: 8px; }
    .kpi .num { font-size: 26px; }
    .medio, .pcs { gap: 12px; margin-top: 12px; }
    .vivo span:last-child { display: none; } .vivo { padding: 10px; }
    .tarjeta.recientes { display: none; } /* en el celular tiene su pestaña abajo */
    /* Navegación abajo, donde llega el pulgar */
    .inferior { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; inset: auto 0 0 0; z-index: 10;
      background: color-mix(in srgb, var(--tarjeta) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 -1px 0 var(--linea); padding: 6px 6px max(8px, env(safe-area-inset-bottom)); }
    .inferior .nav { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 2px; text-align: center; justify-content: center; position: relative; }
    .inferior .nav.activa { background: none; }
    .inferior .nav .cuenta { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="lateral">
    <div class="marca"><img src="/icono-192.png" alt="">Técnica</div>
    <button class="nav activa" data-vista="panel" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Panel</button>
    <button class="nav" data-vista="actividad" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Actividad</button>
    <button class="nav" data-vista="horarios" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Horarios</button>
    <div class="abajo">
      <button class="nav" id="btnNotif" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg><span id="txtNotif">Notificaciones</span></button>
      <a class="nav" href="/logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Salir</a>
    </div>
  </aside>

  <div class="contenido">
    <header class="cabecera">
      <div class="txt"><h1 id="titulo">Panel</h1><p class="sub" id="subtitulo">Conectando…</p></div>
      <span class="vivo"><span id="conn" class="punto"></span><span id="connTxt">Conectando</span></span>
    </header>

    <section class="tarjeta" id="notifSection" hidden><h2>Notificaciones en este dispositivo</h2><div id="notif"></div></section>

    <div class="vista" id="vista-panel">
      <section class="kpis" id="kpis"></section>
      <div class="medio">
        <section class="tarjeta"><h2>Sala</h2><div id="plano"></div></section>
        <section class="tarjeta recientes"><h2>Actividad reciente <button class="mas" data-vista="actividad" type="button">Ver todo</button></h2><div class="eventos" id="recientes"></div></section>
      </div>
      <div class="pcs" id="pcs"></div>
      <section class="tarjeta" id="otrosSection" hidden style="margin-top:18px"><h2>Otros equipos</h2><ul class="filas" id="otros"></ul></section>
    </div>

    <div class="vista" id="vista-actividad" hidden>
      <section class="tarjeta"><h2>Actividad</h2><div class="eventos" id="events"></div></section>
    </div>

    <div class="vista" id="vista-horarios" hidden>
      <section class="tarjeta"><h2>Horarios permitidos</h2><p class="meta" style="margin:-6px 0 12px">Fuera de estos horarios, una compu o un equipo prendido genera una alerta.</p><div id="horarios"></div></section>
    </div>
  </div>
</div>

<nav class="inferior" aria-label="Secciones">
  <button class="nav activa" data-vista="panel" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Panel<span class="cuenta" id="cuentaMovil" hidden></span></button>
  <button class="nav" data-vista="actividad" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Actividad</button>
  <button class="nav" data-vista="horarios" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Horarios</button>
  <button class="nav" id="btnNotifMovil" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>Avisos</button>
</nav>
<script>
const trazo = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const SVG = {
  pc: trazo('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
  app: trazo('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/>'),
  proyector: trazo('<rect x="2" y="8" width="20" height="9" rx="2.5"/><circle cx="15.5" cy="12.5" r="2.6"/><path d="M5.5 11h3.5M5.5 14h3.5"/>'),
  atem: trazo('<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10.5h2M10 10.5h2M14 10.5h2M18.5 9v6M6 14.5h10"/>'),
  equipo: trazo('<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>'),
  remoto: trazo('<path d="M4 12a8 8 0 0 1 16 0M7.5 12a4.5 4.5 0 0 1 9 0"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>'),
  alerta: trazo('<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/>'),
  ok: trazo('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'),
  power: trazo('<path d="M12 3v8M6.3 7.5a8 8 0 1 0 11.4 0"/>'),
  stop: trazo('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
  pausa: trazo('<path d="M9 5v14M15 5v14"/>'),
};
// Ícono y color de cada tipo de evento en la lista de actividad.
const EVENTO = {
  encendido: ['verde', 'power'], apagado: ['gris', 'power'], sin_senal: ['ambar', 'alerta'],
  programa_abierto: ['azul', 'app'], programa_cerrado: ['gris', 'stop'], fuera_de_horario: ['rojo', 'alerta'],
  dispositivo: ['azul', 'equipo'], remoto_conectado: ['ambar', 'remoto'], remoto_desconectado: ['gris', 'remoto'],
  monitor_detenido: ['ambar', 'pausa'], monitor_reanudado: ['verde', 'ok'],
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Horas en la zona del config (la de la iglesia), no la del dispositivo que mira.
let zona;
const hora = iso => iso ? new Date(iso).toLocaleString('es-AR', { timeZone: zona, weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '—';
const horaCorta = iso => iso ? new Date(iso).toLocaleTimeString('es-AR', { timeZone: zona, hour: '2-digit', minute: '2-digit', hour12: false }) : '—';
function hace(iso) {
  if (!iso) return '—';
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return 'hace instantes';
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) { const h = Math.floor(s / 3600); return `hace ${h} ${h === 1 ? 'hora' : 'horas'}`; }
  const d = Math.floor(s / 86400); return `hace ${d} ${d === 1 ? 'día' : 'días'}`;
}
async function api(ruta, opciones) {
  const r = await fetch(ruta, opciones);
  if (r.status === 401) { location.href = '/login'; throw new Error('sesión vencida'); }
  return r;
}
const enumerar = xs => xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} y ${xs.at(-1)}`;

// ---------- Vistas (Panel / Actividad / Horarios) ----------

const TITULOS = { panel: 'Panel', actividad: 'Actividad', horarios: 'Horarios' };
function mostrarVista(v) {
  for (const k of Object.keys(TITULOS)) $('vista-' + k).hidden = k !== v;
  document.querySelectorAll('[data-vista].nav').forEach(b => b.classList.toggle('activa', b.dataset.vista === v));
  $('titulo').textContent = TITULOS[v];
  scrollTo({ top: 0 });
}
document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => mostrarVista(b.dataset.vista)));

// ---------- Estado ----------

let last = null, eventos = [];
const procsAbiertos = new Set();
// Estado visual: on (verde), off (rojo), nd (gris: sin datos).
const claseDev = d => d?.online === true ? 'on' : d?.online === false ? 'off' : 'nd';
const clasePC = m => m.online ? 'on' : (m.detenido || m.nuncaConectada) ? 'nd' : 'off';
const textoDev = c => c === 'on' ? 'Prendido' : c === 'off' ? 'Apagado' : 'Sin datos';
const color = c => c === 'on' ? 'verde' : c === 'off' ? 'rojo' : 'gris';

function kpi(colorC, icono, num, lbl, det, colorDet) {
  return `<div class="tarjeta kpi"><span class="circ ${colorC}">${icono}</span><div>
    <div class="num">${num}</div><div class="lbl">${esc(lbl)}</div>${det ? `<div class="det ${colorDet}">${esc(det)}</div>` : ''}</div></div>`;
}

function indicadores(st) {
  const ms = st.machines, prendidas = ms.filter(m => m.online);
  const fuera = prendidas.filter(m => m.fueraDeHorario).map(m => m.alias);
  const remotos = prendidas.flatMap(m => (m.remotos || []).map(r => `${r.replace(/ desde .*/, '')} en ${m.alias}`));
  const cerrados = ms.filter(m => m.detenido).map(m => m.alias);
  const nAlertas = fuera.length + remotos.length + cerrados.length;
  const proys = st.devices.filter(d => d.tipo === 'proyector');
  const proysOn = proys.filter(d => d.online === true);
  const proysOff = proys.filter(d => d.online === false).map(d => d.nombre);
  const detAlerta = fuera.length ? `${enumerar(fuera)} fuera de horario` : remotos.length ? remotos[0] : cerrados.length ? `Monitor cerrado en ${enumerar(cerrados)}` : 'Todo en orden';
  $('kpis').innerHTML =
    kpi(nAlertas ? 'rojo' : 'verde', nAlertas ? SVG.alerta : SVG.ok, nAlertas, nAlertas === 1 ? 'Alerta' : 'Alertas', detAlerta, nAlertas ? 'rojo' : 'verde') +
    kpi(prendidas.length ? 'verde' : 'gris', SVG.pc, `${prendidas.length}<small>/${ms.length}</small>`, 'Compus prendidas',
      prendidas.length ? enumerar(prendidas.map(m => m.alias)) : 'Todas apagadas', 'tenue') +
    kpi(proysOn.length ? 'verde' : 'gris', SVG.proyector, `${proysOn.length}<small>/${proys.length}</small>`, 'Proyectores',
      proysOff.length && proysOn.length ? `${enumerar(proysOff)} apagado` : proysOn.length ? 'Todos prendidos' : 'Todos apagados', proysOff.length && proysOn.length ? 'rojo' : 'tenue') +
    kpi(remotos.length ? 'ambar' : 'gris', SVG.remoto, remotos.length, 'Conexiones remotas', remotos.length ? remotos.join(', ') : 'Nadie conectado', remotos.length ? 'ambar' : 'tenue');

  // Subtítulo de la cabecera y contador en la navegación.
  const sub = $('subtitulo');
  sub.className = 'sub' + (fuera.length ? ' rojo' : '');
  const enHorario = prendidas.find(m => m.horarioActual)?.horarioActual;
  sub.textContent = fuera.length ? `${enumerar(fuera)} ${fuera.length > 1 ? 'están prendidas' : 'está prendida'} fuera de horario`
    : enHorario ? `En horario: ${enHorario}` : prendidas.length ? 'Todo en orden' : 'Todo apagado';
  for (const el of [$('cuentaMovil')]) { el.hidden = !nAlertas; el.textContent = nAlertas; }
}

// Plano: proyectores con su haz sobre la pantalla, y la cabina con las compus.
function plano(st, devs) {
  const proys = st.devices.filter(d => d.tipo === 'proyector');
  const escenario = proys.length ? `<div class="escenario"><span class="rot">Escenario</span>${proys.map(d => {
    const c = claseDev(d);
    return `<div class="proy ${c}" title="${esc(d.host)}"><div class="pantalla"></div><div class="haz"></div>
      <div class="cuerpo">${SVG.proyector}</div><div class="n">${esc(d.nombre)}</div><div class="st">${textoDev(c)}</div></div>`;
  }).join('')}</div>` : '';
  const puestos = st.machines.map(m => {
    const c = clasePC(m);
    const extras = (m.dispositivos || []).map(n => devs[n]).filter(d => d && d.tipo !== 'proyector')
      .map(d => `<div class="puesto chico ${claseDev(d)}"><span class="ic">${SVG[d.tipo] || SVG.equipo}</span>${esc(d.nombre)}</div>`).join('');
    return `<div class="puesto ${c} ${m.online && m.fueraDeHorario ? 'fuera' : ''}"><span class="ic">${SVG.pc}</span>${esc(m.alias)}</div>${extras}`;
  }).join('');
  $('plano').innerHTML = `${escenario}<div class="cabina"><span class="rot">Cabina</span>${puestos}</div>`;
}

function fila(clase, icono, nombre, estado) {
  return `<li class="${clase}">${icono ? `<span class="ic">${icono}</span>` : '<span class="led"></span>'}<span class="n">${esc(nombre)}</span><span class="st">${esc(estado)}</span></li>`;
}

function tarjetaPC(m, devs) {
  const c = clasePC(m);
  const fuera = m.online && m.fueraDeHorario;
  const badge = fuera ? ['rojo', 'Fuera de horario'] : m.online ? ['verde', 'Prendida'] : m.detenido ? ['ambar', 'Monitor cerrado'] : m.nuncaConectada ? ['gris', 'Sin agente'] : ['rojo', 'Apagada'];
  const sub = m.online ? `Desde las ${horaCorta(m.bootTime)}`
    : m.detenido ? `Lo cerraron ${hace(m.detenido.ts)}${m.detenido.por ? ` (${esc(m.detenido.por)})` : ''}`
    : m.nuncaConectada ? 'Falta instalar el agente' : `Apagada ${hace(m.lastSeen)}`;
  const avisos = [
    ...(m.online ? (m.remotos || []).map(r => `<div class="aviso ambar">${SVG.remoto.replace('<svg', '<svg width="16" height="16"')}Conexión remota: ${esc(r)}</div>`) : []),
    ...(m.online && m.elevado === false ? ['<div class="aviso ambar">El agente no detecta AnyDesk: reinstalalo como administrador</div>'] : []),
  ].join('');
  const filas = [
    ...(m.vigilar || []).map(n => { const ca = !m.online ? 'nd' : (m.programas || []).includes(n) ? 'on' : 'off';
      return fila(ca, '', n, ca === 'on' ? 'Abierto' : ca === 'off' ? 'Cerrado' : '—'); }),
    ...(m.dispositivos || []).map(n => { const d = devs[n], cd = claseDev(d); return fila(cd, SVG[d?.tipo] || SVG.equipo, n, textoDev(cd)); }),
  ].join('');
  return `<section class="tarjeta pc ${fuera ? 'fuera' : ''}">
    <div class="pc-cab"><span class="circ ${color(c)}">${SVG.pc}</span><div class="txt" title="${m.usuario ? 'Usuario: ' + esc(m.usuario) : ''}"><h3>${esc(m.alias || m.id)}</h3><div class="sub">${sub}</div></div>
      <span class="badge ${badge[0]}">${badge[1]}</span></div>
    ${avisos ? `<div class="avisos">${avisos}</div>` : ''}
    ${filas ? `<ul class="filas">${filas}</ul>` : ''}
    ${m.online ? `<details class="procs" data-equipo="${esc(m.id)}" ${procsAbiertos.has(m.id) ? 'open' : ''}>
      <summary>Ver todo lo que está corriendo</summary><div class="lista">cargando…</div></details>` : ''}
  </section>`;
}

function renderState(st) {
  last = st;
  zona = st.zonaHoraria || undefined;
  const devs = Object.fromEntries(st.devices.map(d => [d.nombre, d]));
  indicadores(st);
  plano(st, devs);
  $('pcs').innerHTML = st.machines.length ? st.machines.map(m => tarjetaPC(m, devs)).join('')
    : '<section class="tarjeta"><p class="vacio">Todavía no hay computadoras configuradas.</p></section>';
  document.querySelectorAll('details.procs').forEach(d => {
    d.addEventListener('toggle', () => {
      d.open ? procsAbiertos.add(d.dataset.equipo) : procsAbiertos.delete(d.dataset.equipo);
      if (d.open) cargarProcesos(d);
    });
    if (d.open) cargarProcesos(d);
  });

  const enPCs = new Set(st.machines.flatMap(m => m.dispositivos || []));
  const otros = st.devices.filter(d => !enPCs.has(d.nombre));
  $('otrosSection').hidden = !otros.length;
  $('otros').innerHTML = otros.map(d => { const c = claseDev(d); return fila(c, SVG[d.tipo] || SVG.equipo, d.nombre, textoDev(c)); }).join('');

  $('horarios').innerHTML = st.horarios.map(h =>
    `<div class="horario"><span>${esc(h.nombre)}</span><span>${h.dias.map(esc).join(', ')}, ${esc(h.desde)} a ${esc(h.hasta)}</span></div>`).join('');
}

// Lista completa de procesos de una PC: sirve para saber qué nombre poner en "programas" del config.
async function cargarProcesos(d) {
  const lista = await api('api/procesos?equipo=' + encodeURIComponent(d.dataset.equipo)).then(r => r.json());
  d.querySelector('.lista').innerHTML = lista.length ? lista.map(esc).join('<br>') : 'Sin datos todavía.';
}

function eventRow(e) {
  const [c, i] = EVENTO[e.tipo] || ['gris', 'ok'];
  return `<div class="ev"><span class="circ ${c}">${SVG[i]}</span><span class="txt">${esc(e.mensaje)}<span class="hora">${hora(e.ts)}</span></span></div>`;
}
function renderEventos() {
  const html = n => eventos.length ? eventos.slice(0, n).map(eventRow).join('') : '<p class="vacio">Sin actividad todavía.</p>';
  $('recientes').innerHTML = html(6);
  $('events').innerHTML = html(200);
}
async function loadEvents() {
  eventos = await api('api/eventos?n=200').then(r => r.json());
  renderEventos();
}

function connect() {
  const es = new EventSource('api/stream');
  let primero = true;
  es.onopen = () => { $('conn').className = 'punto on'; $('connTxt').textContent = 'En vivo'; primero = true; };
  es.onerror = () => {
    $('conn').className = 'punto off'; $('connTxt').textContent = 'Reconectando';
    api('api/estado').catch(() => {}); // si la sesión venció, lleva al login
  };
  es.addEventListener('estado', e => {
    renderState(JSON.parse(e.data));
    if (primero) { primero = false; loadEvents(); } // después del estado, para ya tener la zona horaria
  });
  es.addEventListener('evento', e => { eventos.unshift(JSON.parse(e.data)); eventos.length = Math.min(eventos.length, 200); renderEventos(); });
}

// ---------- Notificaciones push ----------

const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const soportaPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let registro = null;

function base64AUint8(b64) {
  const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}

function nombreDispositivo() {
  const ua = navigator.userAgent;
  const so = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || esIOS ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Otro';
  const nav = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return `${so}${nav ? ' · ' + nav : ''}${instalada ? ' (app)' : ''}`;
}

async function suscripcionActual() {
  return registro ? registro.pushManager.getSubscription() : null;
}

async function renderNotif(mensaje = '') {
  const el = $('notif');
  const extra = mensaje ? `<p class="meta" style="margin:0">${esc(mensaje)}</p>` : '';
  if (!window.isSecureContext) {
    el.innerHTML = '<p>Las notificaciones necesitan que el panel se abra con <b>https://</b> (en la VPS con dominio).</p>';
    return actualizarBoton(false);
  }
  if (!soportaPush) {
    el.innerHTML = esIOS && !instalada
      ? `<p>En iPhone/iPad las notificaciones sólo funcionan con el panel <b>instalado como app</b> (iOS 16.4 o más nuevo):</p>
         <ol><li>Abrí esta página en <b>Safari</b>.</li><li>Tocá <b>Compartir</b> (el cuadrado con la flecha).</li>
         <li>Elegí <b>Agregar a inicio</b>.</li><li>Abrí la app <b>Técnica</b> desde la pantalla de inicio y volvé a tocar 🔔.</li></ol>`
      : '<p>Este navegador no admite notificaciones push. Probá con Chrome, Edge, Firefox o Safari actualizados.</p>';
    return actualizarBoton(false);
  }
  const cfg = await api('api/push/config').then(r => r.json());
  if (!cfg.disponible) {
    el.innerHTML = '<p>El servidor no tiene las notificaciones push activadas (falta instalar <code>web-push</code>).</p>';
    return actualizarBoton(false);
  }
  if (Notification.permission === 'denied') {
    el.innerHTML = `<p>Bloqueaste las notificaciones para este sitio. Para activarlas, habilitalas en los ajustes del
      ${instalada ? 'teléfono (Ajustes → Notificaciones → Técnica)' : 'navegador (el candado al lado de la dirección)'} y recargá.</p>`;
    return actualizarBoton(false);
  }
  const sub = await suscripcionActual();
  if (sub) {
    el.innerHTML = `<p>✅ Este dispositivo recibe las notificaciones.</p>${extra}
      <div class="acciones"><button class="btn primario" id="nProbar">Mandar una de prueba</button>
      <button class="btn" id="nDesactivar">Desactivar en este dispositivo</button></div>`;
    $('nProbar').onclick = probar;
    $('nDesactivar').onclick = desactivar;
  } else {
    el.innerHTML = `<p>Activá las notificaciones para recibir los avisos en este dispositivo aunque el panel esté cerrado.</p>${extra}
      <div class="acciones"><button class="btn primario" id="nActivar">Activar notificaciones</button></div>`;
    $('nActivar').onclick = activar;
  }
  actualizarBoton(!!sub);
}

function actualizarBoton(activas) {
  $('txtNotif').textContent = activas ? 'Notificaciones activas' : 'Activar notificaciones';
  $('btnNotif').classList.toggle('activa', !activas);
}

async function activar() {
  try {
    // El pedido de permiso tiene que salir directo del toque en el botón (requisito de iOS).
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') return renderNotif();
    const cfg = await api('api/push/config').then(r => r.json());
    const sub = await registro.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64AUint8(cfg.clave) });
    const r = await api('api/push/suscribir', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...sub.toJSON(), dispositivo: nombreDispositivo() }) });
    if (!r.ok) throw new Error((await r.json()).error);
    renderNotif('Listo. Probá mandar una de prueba.');
  } catch (e) {
    renderNotif('No se pudo activar: ' + e.message);
  }
}

async function desactivar() {
  const sub = await suscripcionActual();
  if (sub) {
    await api('api/push/desuscribir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
    await sub.unsubscribe();
  }
  renderNotif('Desactivadas en este dispositivo.');
}

async function probar() {
  const sub = await suscripcionActual();
  const r = await api('api/push/probar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
  renderNotif(r.ok ? 'Enviada. Debería llegar en unos segundos.' : 'Falló: ' + (await r.json()).error);
}

$('btnNotif').onclick = $('btnNotifMovil').onclick = () => {
  $('notifSection').hidden = !$('notifSection').hidden;
  if (!$('notifSection').hidden) { renderNotif(); scrollTo({ top: 0, behavior: 'smooth' }); }
};

async function iniciarPush() {
  if (soportaPush && window.isSecureContext) {
    registro = await navigator.serviceWorker.register('/sw.js').catch(() => null);
    await navigator.serviceWorker.ready.catch(() => {});
  }
  const sub = await suscripcionActual().catch(() => null);
  actualizarBoton(!!sub);
  // Si todavía no las activó, se muestra el recuadro de notificaciones una vez al entrar.
  if (!sub && (soportaPush || esIOS) && window.Notification?.permission !== 'denied') {
    $('notifSection').hidden = false;
    renderNotif();
  }
}

setInterval(() => last && renderState(last), 30000);
connect();
iniciarPush();
</script>
</body>
</html>
