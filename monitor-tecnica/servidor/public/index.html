<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Técnica</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --ok: #16a34a; --off: #9ca3af; --warn: #d97706; --bad: #dc2626; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181c24; --text: #e6e8ec; --muted: #9aa3b2; --line: #2a303b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); display: inline-block; flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card.alerta { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 600; font-size: 16px; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .card .estado { font-size: 13px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .chip.remoto { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); font-weight: 600; }
  .banner { margin-top: 10px; font-size: 13px; color: var(--bad); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  tr:first-child td { border-top: 0; }
  td.t { white-space: nowrap; color: var(--muted); width: 1%; }
  td.i { width: 1%; }
  .empty { color: var(--muted); padding: 14px; }
  .horarios { font-size: 13px; color: var(--muted); }
  .tm { display: none; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { td.t { display: none; } .tm { display: block; } }
</style>
</head>
<body>
<header>
  <h1>Monitor de Técnica</h1>
  <span class="live"><span id="conn" class="dot"></span><span id="connTxt">conectando…</span></span>
</header>
<main>
  <section>
    <h2>Computadoras</h2>
    <div id="machines" class="grid"></div>
  </section>
  <section id="devSection" hidden>
    <h2>Equipos en red</h2>
    <div id="devices" class="grid"></div>
  </section>
  <section>
    <h2>Horarios permitidos</h2>
    <div id="horarios" class="horarios"></div>
  </section>
  <section>
    <h2>Registro de actividad</h2>
    <table><tbody id="events"></tbody></table>
  </section>
</main>
<script>
const ICONOS = { encendido: '🟢', apagado: '⚪', sin_senal: '🟠', programa_abierto: '▶️', programa_cerrado: '⏹️', fuera_de_horario: '🚨', dispositivo: '🔌',
  remoto_conectado: '🖥️', remoto_desconectado: '🖥️', monitor_detenido: '⏸️', monitor_reanudado: '▶️' };
const AVISOS = ['fuera_de_horario', 'remoto_conectado', 'monitor_detenido'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hora = iso => iso ? new Date(iso).toLocaleString('es-AR', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
function hace(iso) {
  if (!iso) return '—';
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return 'hace instantes';
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`;
  return `hace ${Math.floor(s / 86400)} días`;
}

let last = null;
function renderState(st) {
  last = st;
  const ms = st.machines.sort((a, b) => (a.alias || a.id).localeCompare(b.alias || b.id));
  $('machines').innerHTML = ms.length ? ms.map(m => `
    <div class="card ${m.online && m.fueraDeHorario ? 'alerta' : ''}">
      <div class="top">
        <span class="dot ${m.online ? (m.fueraDeHorario ? 'bad' : 'ok') : ''}"></span>
        <span class="name">${esc(m.alias || m.id)}</span>
        <span class="estado" style="color:var(${m.online ? '--ok' : m.detenido ? '--warn' : '--muted'})">${m.online ? 'Encendida' : m.detenido ? 'Monitor cerrado' : 'Apagada'}</span>
      </div>
      <div class="meta">${m.online
        ? `Encendida desde ${hora(m.bootTime)}${m.usuario ? ` · usuario ${esc(m.usuario)}` : ''}`
        : m.detenido
          ? `Cerraron el monitor ${hace(m.detenido.ts)}${m.detenido.por ? ` (usuario ${esc(m.detenido.por)})` : ''}. Se desconoce el estado.`
          : `Última señal ${hace(m.lastSeen)} (${hora(m.lastSeen)})`}</div>
      ${m.online && m.horarioActual ? `<div class="meta">En horario: ${esc(m.horarioActual)}</div>` : ''}
      ${m.online && m.remotos?.length ? `<div class="chips">${m.remotos.map(r => `<span class="chip remoto">🖥️ Remoto: ${esc(r)}</span>`).join('')}</div>` : ''}
      <div class="chips">${(m.programas || []).map(p => `<span class="chip">${esc(p)}</span>`).join('') ||
        (m.online ? '<span class="meta" style="margin:0">Ningún programa vigilado abierto</span>' : '')}</div>
      ${m.online && m.fueraDeHorario ? '<div class="banner">🚨 Encendida fuera de horario</div>' : ''}
    </div>`).join('') : '<div class="card empty">Todavía no se conectó ninguna PC. Instalá el agente en cada computadora.</div>';

  $('devSection').hidden = !st.devices.length;
  $('devices').innerHTML = st.devices.map(d => `
    <div class="card"><div class="top">
      <span class="dot ${d.online ? 'ok' : ''}"></span><span class="name">${esc(d.nombre)}</span>
      <span class="estado" style="color:var(${d.online ? '--ok' : '--muted'})">${d.online ? 'En línea' : 'Apagado'}</span>
    </div><div class="meta">${esc(d.host)} · ${d.online ? 'en línea' : 'apagado'} ${hace(d.desde)}</div></div>`).join('');

  $('horarios').innerHTML = st.horarios.map(h =>
    `${esc(h.nombre)}: ${h.dias.map(esc).join(', ')} de ${esc(h.desde)} a ${esc(h.hasta)}`).join('<br>');
}

function eventRow(e) {
  return `<tr><td class="t">${hora(e.ts)}</td><td class="i">${ICONOS[e.tipo] || 'ℹ️'}</td><td>${esc(e.mensaje)}<span class="tm">${hora(e.ts)}</span></td></tr>`;
}
async function loadEvents() {
  const evs = await fetch('api/eventos?n=200').then(r => r.json());
  $('events').innerHTML = evs.length ? evs.map(eventRow).join('') : '<tr><td class="empty">Sin actividad todavía.</td></tr>';
}

function connect() {
  const es = new EventSource('api/stream');
  es.onopen = () => { $('conn').className = 'dot ok'; $('connTxt').textContent = 'en vivo'; loadEvents(); };
  es.onerror = () => { $('conn').className = 'dot bad'; $('connTxt').textContent = 'reconectando…'; };
  es.addEventListener('estado', e => renderState(JSON.parse(e.data)));
  es.addEventListener('evento', e => {
    const ev = JSON.parse(e.data);
    const tb = $('events');
    if (tb.querySelector('.empty')) tb.innerHTML = '';
    tb.insertAdjacentHTML('afterbegin', eventRow(ev));
    if (AVISOS.includes(ev.tipo) && window.Notification?.permission === 'granted') new Notification('Monitor de Técnica', { body: ev.mensaje });
  });
}
if (window.Notification && Notification.permission === 'default') document.addEventListener('click', () => Notification.requestPermission(), { once: true });
setInterval(() => last && renderState(last), 30000);
connect();
</script>
</body>
</html>
