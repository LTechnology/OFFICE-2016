<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor de Técnica</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Técnica">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Lenguaje visual de la cabina: módulos de rack con LEDs de estado.
     Verde = encendido/abierto, rojo = apagado/cerrado, gris = sin datos. */
  :root {
    --rack: #e6e8eb; --panel: #f8f9fa; --panel-2: #eef0f2; --line: #d5d9de; --text: #15191e; --muted: #5d6671;
    --on: #13a150; --off: #d63a31; --nd: #a5adb7; --amber: #b56a00; --accent: #1f5fd1;
    --display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --rack: #1b1f25; --panel: #242a32; --panel-2: #2c333c; --line: #363e49; --text: #e8eaed; --muted: #9ba4af;
      --on: #36d672; --off: #ff5c53; --nd: #66707c; --amber: #ffb22e; --accent: #82b8ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 var(--body); background: var(--rack); color: var(--text); -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Barra superior */
  .barra { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: color-mix(in srgb, var(--rack) 85%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); }
  .barra img { width: 28px; height: 28px; border-radius: 7px; }
  .barra h1 { font: 600 19px/1 var(--display); margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn { font: 600 15px var(--body); padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn.primario { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.btn { text-decoration: none; }
  .led { width: 9px; height: 9px; border-radius: 50%; background: var(--nd); display: inline-block; flex: none; }
  .on > .led, .led.on { background: var(--on); box-shadow: 0 0 8px color-mix(in srgb, var(--on) 70%, transparent); }
  .off > .led, .led.off { background: var(--off); box-shadow: 0 0 8px color-mix(in srgb, var(--off) 60%, transparent); }

  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px; padding-bottom: max(32px, env(safe-area-inset-bottom)); display: grid; gap: 28px; }
  h2 { font: 600 21px/1.2 var(--display); margin: 0 0 12px; }

  /* Estado general: lo primero que se lee */
  .estado-general { display: grid; gap: 6px; }
  .estado-general .titulo { font: 700 clamp(30px, 5vw, 46px)/1.05 var(--display); letter-spacing: -.01em; margin: 0; }
  .estado-general.off .titulo { color: var(--off); }
  .estado-general.on .titulo { color: var(--on); }
  .estado-general .linea { margin: 0; color: var(--muted); font-size: 17px; }
  .estado-general .linea.ambar { color: var(--amber); font-weight: 600; }

  /* Módulos de PC */
  .sala { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .mod { --c: var(--nd); position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 16px 14px 22px; display: grid; gap: 12px; align-content: start; overflow: hidden; }
  .mod::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c); }
  .mod.on { --c: var(--on); } .mod.off { --c: var(--off); }
  .mod.fuera { border-color: var(--off); }
  .mod-cab { display: flex; align-items: center; gap: 12px; }
  .lamp { width: 16px; height: 16px; border-radius: 50%; flex: none; background: var(--c);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent), 0 0 16px color-mix(in srgb, var(--c) 55%, transparent); }
  .mod.nd .lamp { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
  .mod-cab h3 { font: 700 28px/1 var(--display); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mod-cab .estado { font: 600 17px/1 var(--display); color: var(--c); white-space: nowrap; }
  .mod.nd .mod-cab .estado { color: var(--muted); }
  .mod-sub { margin: -4px 0 0 28px; font-size: 14px; color: var(--muted); }
  .aviso { margin: 0; padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 15px; }
  .aviso.rojo { color: var(--off); background: color-mix(in srgb, var(--off) 12%, transparent); }
  .aviso.ambar { color: var(--amber); background: color-mix(in srgb, var(--amber) 13%, transparent); }

  .leds { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .leds li { display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 17px; }
  .leds li .n { flex: 1; }
  .leds li .st { font-size: 14px; font-weight: 500; color: var(--muted); }
  .leds li.on .st { color: var(--on); } .leds li.off .st { color: var(--off); }
  .leds li.nd { color: var(--muted); }

  .equipos { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .eq { --c: var(--nd); display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 8px; row-gap: 1px; min-width: 120px; }
  .eq.on { --c: var(--on); } .eq.off { --c: var(--off); }
  .eq svg { width: 36px; height: 36px; color: var(--c); grid-row: span 2; }
  .eq .n { font-weight: 600; font-size: 15px; line-height: 1.15; }
  .eq .st { font-size: 13px; color: var(--c); display: flex; align-items: center; gap: 5px; }
  .eq.nd .st { color: var(--muted); }

  details.procs { font-size: 14px; }
  details.procs summary { cursor: pointer; color: var(--muted); }
  details.procs .lista { margin-top: 8px; max-height: 200px; overflow: auto; color: var(--muted); font-size: 13px; columns: 2; }

  /* Notificaciones */
  #notif { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  #notif p { margin: 0; }
  #notif ol { margin: 0; padding-left: 20px; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 14px; }

  /* Registro y horarios */
  .registro { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; font-size: 15px; }
  tr:first-child td { border-top: 0; }
  td.t { white-space: nowrap; color: var(--muted); width: 1%; font-variant-numeric: tabular-nums; }
  td.i { width: 1%; }
  .empty { color: var(--muted); padding: 14px; }
  .horarios { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); font-size: 15px; }
  .horarios b { color: var(--text); font-weight: 600; }
  .tm { display: none; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    .mod.fuera .lamp { animation: latido 1.6s ease-in-out infinite; }
    @keyframes latido { 50% { opacity: .35; } }
  }
  @media (max-width: 560px) {
    main { padding: 16px 12px; gap: 24px; }
    .sala { grid-template-columns: 1fr; }
    td.t { display: none; } .tm { display: block; }
    #connTxt, #salir { display: none; }
  }
</style>
</head>
<body>
<header class="barra">
  <img src="/icono-192.png" alt="">
  <h1>Monitor de Técnica</h1>
  <span class="live"><span id="conn" class="led"></span><span id="connTxt">conectando…</span></span>
  <button class="btn" id="btnNotif" type="button" aria-label="Notificaciones">🔔</button>
  <a class="btn" id="salir" href="/logout">Salir</a>
</header>
<main>
  <section id="notifSection" hidden>
    <h2>Notificaciones en este dispositivo</h2>
    <div id="notif"></div>
  </section>

  <section class="estado-general" id="estadoGeneral" aria-live="polite"></section>

  <section id="sala" class="sala" aria-label="Computadoras"></section>

  <section id="otrosSection" hidden>
    <h2>Otros equipos en red</h2>
    <div id="otros" class="equipos"></div>
  </section>

  <section>
    <h2>Actividad</h2>
    <div class="registro"><table><tbody id="events"></tbody></table></div>
  </section>

  <section>
    <h2>Horarios permitidos</h2>
    <ul id="horarios" class="horarios"></ul>
  </section>
</main>
<script>
const ICONOS = { encendido: '🟢', apagado: '⚪', sin_senal: '🟠', programa_abierto: '▶️', programa_cerrado: '⏹️', fuera_de_horario: '🚨', dispositivo: '🔌',
  remoto_conectado: '🖥️', remoto_desconectado: '🖥️', monitor_detenido: '⏸️', monitor_reanudado: '▶️' };
const SVG = {
  pc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  proyector: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="9" rx="2.5"/><circle cx="15.5" cy="12.5" r="2.6"/><path d="M5.5 11h3.5M5.5 14h3.5M6 17v2M18 17v2"/></svg>',
  atem: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><rect x="4.5" y="9" width="3" height="3" rx=".6"/><rect x="8.5" y="9" width="3" height="3" rx=".6"/><rect x="12.5" y="9" width="3" height="3" rx=".6"/><path d="M18.5 9v6M4.5 15h11"/></svg>',
  equipo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>',
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Horas en la zona del config (la de la iglesia), no la del dispositivo que mira.
let zona;
const hora = iso => iso ? new Date(iso).toLocaleString('es-AR', { timeZone: zona, weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const horaCorta = iso => iso ? new Date(iso).toLocaleTimeString('es-AR', { timeZone: zona, hour: '2-digit', minute: '2-digit' }) : '—';
function hace(iso) {
  if (!iso) return '—';
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return 'hace instantes';
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`;
  return `hace ${Math.floor(s / 86400)} días`;
}
async function api(ruta, opciones) {
  const r = await fetch(ruta, opciones);
  if (r.status === 401) { location.href = '/login'; throw new Error('sesión vencida'); }
  return r;
}

// ---------- Estado ----------

let last = null;
const procsAbiertos = new Set();
// Estado visual: on (verde), off (rojo), nd (gris: sin datos).
const claseDev = d => d?.online === true ? 'on' : d?.online === false ? 'off' : 'nd';
const enumerar = xs => xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} y ${xs.at(-1)}`;

function tarjetaEquipo(d, nombre) {
  const c = claseDev(d);
  const st = c === 'on' ? 'Encendido' : c === 'off' ? 'Apagado' : 'Sin datos';
  const titulo = d ? `${d.host}${d.online != null ? `, ${st.toLowerCase()} ${hace(d.desde)}` : ''}` : '';
  return `<div class="eq ${c}" title="${esc(titulo)}">${SVG[d?.tipo] || SVG.equipo}<span class="n">${esc(nombre)}</span><span class="st"><span class="led ${c}"></span>${st}</span></div>`;
}

function tarjetaPC(m, devs) {
  const c = m.online ? 'on' : (m.detenido || m.nuncaConectada) ? 'nd' : 'off';
  const estado = m.online ? 'Encendida' : m.detenido ? 'Monitor cerrado' : m.nuncaConectada ? 'Sin agente' : 'Apagada';
  const usuario = m.usuario ? `, usuario ${esc(m.usuario.split('\\').pop())}` : '';
  const sub = m.online ? `Desde las ${horaCorta(m.bootTime)}${usuario}`
    : m.detenido ? `Lo cerraron ${hace(m.detenido.ts)}${m.detenido.por ? ` (${esc(m.detenido.por)})` : ''}. No se sabe si está prendida.`
    : m.nuncaConectada ? 'Todavía no se instaló el agente en esta compu.'
    : `Última señal ${hace(m.lastSeen)}`;
  const apps = (m.vigilar || []).map(n => {
    const ca = !m.online ? 'nd' : (m.programas || []).includes(n) ? 'on' : 'off';
    return `<li class="${ca}"><span class="led"></span><span class="n">${esc(n)}</span><span class="st">${ca === 'on' ? 'Abierto' : ca === 'off' ? 'Cerrado' : '—'}</span></li>`;
  }).join('');
  const equipos = (m.dispositivos || []).map(n => tarjetaEquipo(devs[n], n)).join('');
  return `<article class="mod ${c} ${m.online && m.fueraDeHorario ? 'fuera' : ''}">
    <div class="mod-cab"><span class="lamp"></span><h3>${esc(m.alias || m.id)}</h3><span class="estado">${estado}</span></div>
    <p class="mod-sub">${sub}</p>
    ${m.online && m.fueraDeHorario ? '<p class="aviso rojo">Encendida fuera de horario</p>' : ''}
    ${m.online ? (m.remotos || []).map(r => `<p class="aviso ambar">Conexión remota: ${esc(r)}</p>`).join('') : ''}
    ${m.online && m.elevado === false ? '<p class="aviso ambar">El agente no tiene permisos de administrador y no detecta AnyDesk. Reinstalalo.</p>' : ''}
    ${apps ? `<ul class="leds" aria-label="Programas">${apps}</ul>` : ''}
    ${equipos ? `<div class="equipos" aria-label="Equipos">${equipos}</div>` : ''}
    ${m.online ? `<details class="procs" data-equipo="${esc(m.id)}" ${procsAbiertos.has(m.id) ? 'open' : ''}>
      <summary>Ver todos los procesos</summary><div class="lista">cargando…</div></details>` : ''}
  </article>`;
}

// La frase grande de arriba: responde "¿está todo bien?" sin tener que leer las tarjetas.
function estadoGeneral(st, devs) {
  const ms = st.machines;
  const encendidas = ms.filter(m => m.online);
  const fuera = encendidas.filter(m => m.fueraDeHorario).map(m => m.alias);
  let clase, titulo;
  if (fuera.length) {
    clase = 'off';
    titulo = `${enumerar(fuera)} ${fuera.length > 1 ? 'están encendidas' : 'está encendida'} fuera de horario`;
  } else if (encendidas.length) {
    clase = 'on'; titulo = 'Todo en orden';
  } else {
    clase = 'nd'; titulo = 'Todo apagado';
  }
  const lineas = [];
  for (const m of encendidas) for (const r of m.remotos || []) lineas.push(['ambar', `Conexión remota a ${m.alias}: ${r}`]);
  for (const m of ms.filter(m => m.detenido)) lineas.push(['ambar', `En ${m.alias} cerraron el monitor`]);
  const enHorario = encendidas.find(m => m.horarioActual)?.horarioActual;
  const proys = st.devices.filter(d => d.tipo === 'proyector');
  const partes = [`${encendidas.length} de ${ms.length} compus encendidas`];
  if (proys.length) partes.push(`${proys.filter(d => d.online === true).length} de ${proys.length} proyectores`);
  lineas.push(['', partes.join(', ') + (enHorario ? `. En horario: ${enHorario}.` : '.')]);
  $('estadoGeneral').className = `estado-general ${clase}`;
  $('estadoGeneral').innerHTML = `<p class="titulo">${esc(titulo)}</p>` +
    lineas.map(([c, t]) => `<p class="linea ${c}">${esc(t)}</p>`).join('');
}

function renderState(st) {
  last = st;
  zona = st.zonaHoraria || undefined;
  const devs = Object.fromEntries(st.devices.map(d => [d.nombre, d]));
  estadoGeneral(st, devs);

  $('sala').innerHTML = st.machines.length
    ? st.machines.map(m => tarjetaPC(m, devs)).join('')
    : '<div class="empty">Todavía no hay computadoras configuradas.</div>';
  document.querySelectorAll('details.procs').forEach(d => {
    d.addEventListener('toggle', () => {
      d.open ? procsAbiertos.add(d.dataset.equipo) : procsAbiertos.delete(d.dataset.equipo);
      if (d.open) cargarProcesos(d);
    });
    if (d.open) cargarProcesos(d);
  });

  // Equipos que no pertenecen a ninguna tarjeta de PC.
  const enTarjetas = new Set(st.machines.flatMap(m => m.dispositivos || []));
  const otros = st.devices.filter(d => !enTarjetas.has(d.nombre));
  $('otrosSection').hidden = !otros.length;
  $('otros').innerHTML = otros.map(d => tarjetaEquipo(d, d.nombre)).join('');

  $('horarios').innerHTML = st.horarios.map(h =>
    `<li><b>${esc(h.nombre)}</b>: ${h.dias.map(esc).join(', ')} de ${esc(h.desde)} a ${esc(h.hasta)}</li>`).join('');
}

// Lista completa de procesos de una PC: sirve para saber qué nombre poner en "programas" del config.
async function cargarProcesos(d) {
  const lista = await api('api/procesos?equipo=' + encodeURIComponent(d.dataset.equipo)).then(r => r.json());
  d.querySelector('.lista').innerHTML = lista.length ? lista.map(esc).join('<br>') : 'Sin datos todavía.';
}

function eventRow(e) {
  return `<tr><td class="t">${hora(e.ts)}</td><td class="i">${ICONOS[e.tipo] || 'ℹ️'}</td><td>${esc(e.mensaje)}<span class="tm">${hora(e.ts)}</span></td></tr>`;
}
async function loadEvents() {
  const evs = await api('api/eventos?n=200').then(r => r.json());
  $('events').innerHTML = evs.length ? evs.map(eventRow).join('') : '<tr><td class="empty">Sin actividad todavía.</td></tr>';
}

function connect() {
  const es = new EventSource('api/stream');
  let primero = true;
  es.onopen = () => { $('conn').className = 'led on'; $('connTxt').textContent = 'en vivo'; primero = true; };
  es.onerror = () => {
    $('conn').className = 'led off'; $('connTxt').textContent = 'reconectando…';
    api('api/estado').catch(() => {}); // si la sesión venció, lleva al login
  };
  es.addEventListener('estado', e => {
    renderState(JSON.parse(e.data));
    if (primero) { primero = false; loadEvents(); } // después del estado, para ya tener la zona horaria
  });
  es.addEventListener('evento', e => {
    const tb = $('events');
    if (tb.querySelector('.empty')) tb.innerHTML = '';
    tb.insertAdjacentHTML('afterbegin', eventRow(JSON.parse(e.data)));
  });
}

// ---------- Notificaciones push ----------

const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const soportaPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let registro = null;

function base64AUint8(b64) {
  const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}

function nombreDispositivo() {
  const ua = navigator.userAgent;
  const so = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || esIOS ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'Otro';
  const nav = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return `${so}${nav ? ' · ' + nav : ''}${instalada ? ' (app)' : ''}`;
}

async function suscripcionActual() {
  return registro ? registro.pushManager.getSubscription() : null;
}

async function renderNotif(mensaje = '') {
  const el = $('notif');
  const extra = mensaje ? `<p class="meta" style="margin:0">${esc(mensaje)}</p>` : '';
  if (!window.isSecureContext) {
    el.innerHTML = '<p>Las notificaciones necesitan que el panel se abra con <b>https://</b> (en la VPS con dominio).</p>';
    return actualizarBoton(false);
  }
  if (!soportaPush) {
    el.innerHTML = esIOS && !instalada
      ? `<p>En iPhone/iPad las notificaciones sólo funcionan con el panel <b>instalado como app</b> (iOS 16.4 o más nuevo):</p>
         <ol><li>Abrí esta página en <b>Safari</b>.</li><li>Tocá <b>Compartir</b> (el cuadrado con la flecha).</li>
         <li>Elegí <b>Agregar a inicio</b>.</li><li>Abrí la app <b>Técnica</b> desde la pantalla de inicio y volvé a tocar 🔔.</li></ol>`
      : '<p>Este navegador no admite notificaciones push. Probá con Chrome, Edge, Firefox o Safari actualizados.</p>';
    return actualizarBoton(false);
  }
  const cfg = await api('api/push/config').then(r => r.json());
  if (!cfg.disponible) {
    el.innerHTML = '<p>El servidor no tiene las notificaciones push activadas (falta instalar <code>web-push</code>).</p>';
    return actualizarBoton(false);
  }
  if (Notification.permission === 'denied') {
    el.innerHTML = `<p>Bloqueaste las notificaciones para este sitio. Para activarlas, habilitalas en los ajustes del
      ${instalada ? 'teléfono (Ajustes → Notificaciones → Técnica)' : 'navegador (el candado al lado de la dirección)'} y recargá.</p>`;
    return actualizarBoton(false);
  }
  const sub = await suscripcionActual();
  if (sub) {
    el.innerHTML = `<p>✅ Este dispositivo recibe las notificaciones.</p>${extra}
      <div class="acciones"><button class="btn primario" id="nProbar">Mandar una de prueba</button>
      <button class="btn" id="nDesactivar">Desactivar en este dispositivo</button></div>`;
    $('nProbar').onclick = probar;
    $('nDesactivar').onclick = desactivar;
  } else {
    el.innerHTML = `<p>Activá las notificaciones para recibir los avisos en este dispositivo aunque el panel esté cerrado.</p>${extra}
      <div class="acciones"><button class="btn primario" id="nActivar">Activar notificaciones</button></div>`;
    $('nActivar').onclick = activar;
  }
  actualizarBoton(!!sub);
}

function actualizarBoton(activas) {
  $('btnNotif').textContent = activas ? '🔔' : '🔕';
  $('btnNotif').title = activas ? 'Notificaciones activadas' : 'Activar notificaciones';
}

async function activar() {
  try {
    // El pedido de permiso tiene que salir directo del toque en el botón (requisito de iOS).
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') return renderNotif();
    const cfg = await api('api/push/config').then(r => r.json());
    const sub = await registro.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64AUint8(cfg.clave) });
    const r = await api('api/push/suscribir', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...sub.toJSON(), dispositivo: nombreDispositivo() }) });
    if (!r.ok) throw new Error((await r.json()).error);
    renderNotif('Listo. Probá mandar una de prueba.');
  } catch (e) {
    renderNotif('No se pudo activar: ' + e.message);
  }
}

async function desactivar() {
  const sub = await suscripcionActual();
  if (sub) {
    await api('api/push/desuscribir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
    await sub.unsubscribe();
  }
  renderNotif('Desactivadas en este dispositivo.');
}

async function probar() {
  const sub = await suscripcionActual();
  const r = await api('api/push/probar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
  renderNotif(r.ok ? 'Enviada. Debería llegar en unos segundos.' : 'Falló: ' + (await r.json()).error);
}

$('btnNotif').onclick = () => {
  $('notifSection').hidden = !$('notifSection').hidden;
  if (!$('notifSection').hidden) { renderNotif(); scrollTo({ top: 0, behavior: 'smooth' }); }
};

async function iniciarPush() {
  if (soportaPush && window.isSecureContext) {
    registro = await navigator.serviceWorker.register('/sw.js').catch(() => null);
    await navigator.serviceWorker.ready.catch(() => {});
  }
  const sub = await suscripcionActual().catch(() => null);
  actualizarBoton(!!sub);
  // Si todavía no las activó, se muestra el recuadro de notificaciones una vez al entrar.
  if (!sub && (soportaPush || esIOS) && window.Notification?.permission !== 'denied') {
    $('notifSection').hidden = false;
    renderNotif();
  }
}

setInterval(() => last && renderState(last), 30000);
connect();
iniciarPush();
</script>
</body>
</html>
