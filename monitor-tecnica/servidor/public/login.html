<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor de Técnica</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Técnica">
<meta name="theme-color" content="#0f1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Semi+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --rack: #e6e8eb; --panel: #f8f9fa; --text: #15191e; --muted: #5d6671; --line: #d5d9de; --accent: #1f5fd1; --off: #d63a31;
    --display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --rack: #1b1f25; --panel: #242a32; --text: #e8eaed; --muted: #9ba4af; --line: #363e49; --accent: #82b8ff; --off: #ff5c53; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font: 16px/1.45 var(--body); background: var(--rack); color: var(--text); }
  form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 14px; }
  img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { font: 700 30px/1.05 var(--display); margin: 0; }
  label { font-size: 15px; color: var(--muted); display: grid; gap: 6px; }
  input { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--rack); color: var(--text); }
  button { font: 600 16px var(--body); padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: var(--off); font-size: 15px; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/icono-192.png" alt="">
  <h1>Monitor de Técnica</h1>
  <p class="error" id="error" hidden>Clave incorrecta.</p>
  <label>Clave
    <input type="password" name="clave" autocomplete="current-password" required autofocus>
  </label>
  <button type="submit">Entrar</button>
</form>
<script>
  if (new URLSearchParams(location.search).has('error')) document.getElementById('error').hidden = false;
</script>
</body>
</html>
