<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor de Técnica</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Técnica">
<meta name="theme-color" content="#eef1f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --fondo: #eef1f6; --tarjeta: #fff; --texto: #262b38; --tenue: #8a91a3; --linea: #e3e7ee; --azul: #3b7cf6; --rojo: #f0465a;
    --sombra: 0 6px 24px rgba(31, 45, 80, .07), 0 1px 3px rgba(31, 45, 80, .05); }
  @media (prefers-color-scheme: dark) { :root { --fondo: #151923; --tarjeta: #1e2330; --texto: #eef0f5; --tenue: #8f97aa; --linea: #2a3040; --azul: #6b9dff; --rojo: #ff5f71; --sombra: 0 6px 24px rgba(0,0,0,.25); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font: 15px/1.45 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  form { width: 100%; max-width: 360px; background: var(--tarjeta); border-radius: 16px; box-shadow: var(--sombra); padding: 28px; display: grid; gap: 16px; }
  img { width: 48px; height: 48px; border-radius: 12px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  label { font-size: 13px; font-weight: 600; color: var(--tenue); display: grid; gap: 6px; }
  input { font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--linea); background: var(--fondo); color: var(--texto); }
  button { font: inherit; font-weight: 600; font-size: 15px; padding: 12px; border: 0; border-radius: 10px; background: var(--azul); color: #fff; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .error { color: var(--rojo); font-size: 14px; font-weight: 600; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/icono-192.png" alt="">
  <h1>Monitor de Técnica</h1>
  <p class="error" id="error" hidden>Clave incorrecta.</p>
  <label>Clave
    <input type="password" name="clave" autocomplete="current-password" required autofocus>
  </label>
  <button type="submit">Entrar</button>
</form>
<script>
  if (new URLSearchParams(location.search).has('error')) document.getElementById('error').hidden = false;
</script>
</body>
</html>
